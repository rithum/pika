# Weather Service Example - YAML Configuration
# A simple weather service that demonstrates the Pika Serverless Plugin
service: weather-service

frameworkVersion: '3'

plugins:
    - '@pika/pika-serverless'

provider:
    name: aws
    runtime: nodejs22.x
    region: us-east-1
    stage: ${opt:stage, 'dev'}
    timeout: 30

    # IAM permissions for your functions
    iam:
        role:
            statements:
                - Effect: Allow
                  Action:
                      - logs:CreateLogGroup
                      - logs:CreateLogStream
                      - logs:PutLogEvents
                  Resource: arn:aws:logs:*:*:*
                - Effect: Allow
                  Action:
                      - ssm:GetParameter
                      - ssm:GetParameters
                  Resource: arn:aws:ssm:${aws:region}:${aws:accountId}:parameter/*

    environment:
        STAGE: ${self:provider.stage}
        REGION: ${aws:region}

# Pika configuration
custom:
    pika:
        # Custom resource ARNs (resolved at deploy time)
        agentCustomResourceArn: '{{resolve:ssm:/stack/pika/${self:provider.stage}/lambda/agent_custom_resource_arn}}'
        chatAppCustomResourceArn: '{{resolve:ssm:/stack/pika/${self:provider.stage}/lambda/chat_app_custom_resource_arn}}'

        # Define your AI agents
        agents:
            - userId: 'cloudformation/${self:service}'
              agent:
                  agentId: '${self:service}-agent-${self:provider.stage}'
                  basePrompt: |
                      You are WeatherInsightAgent, a highly skilled assistant for analyzing weather data and providing actionable insights. 
                      Your goal is to answer weather-related questions clearly and comprehensively and to do it with a dry sense of humor.

                      Core Directives:
                      1. Accuracy and Detail: Provide accurate weather information. Be as detailed as necessary to fully answer the user's query.
                      2. User-Centricity: Focus on making the information easily understandable and useful to the user.
                      3. Proactive Assistance: When appropriate, suggest relevant follow-up questions or explorations.
                      4. Correctly Structured Response: Your response must exactly conform to the Output Formatting Requirements below
              tools:
                  - toolId: '${self:service}-tool-${self:provider.stage}'
                    name: 'weather-tool'
                    displayName: 'Weather Information Tool'
                    description: 'A tool that provides current weather conditions and forecasts'
                    executionType: 'lambda'
                    lambdaFunctionLogicalId: 'weatherFunction' # References function below
                    functionSchema:
                        - name: 'getCurrentWeather'
                          description: 'Get current weather for a location'
                          parameters:
                              type: 'object'
                              properties:
                                  latitude:
                                      type: 'number'
                                      description: 'Latitude of the location in decimal degrees (e.g., 37.7749)'
                                  longitude:
                                      type: 'number'
                                      description: 'Longitude of the location in decimal degrees (e.g., -122.4194)'
                                  timezone:
                                      type: 'string'
                                      description: 'Timezone for the returned data (e.g., America/Los_Angeles)'
                              required: ['latitude', 'longitude']
                        - name: 'getWeatherForecast'
                          description: 'Get weather forecast for a location and time range'
                          parameters:
                              type: 'object'
                              properties:
                                  latitude:
                                      type: 'number'
                                      description: 'Latitude of the location in decimal degrees (e.g., 37.7749)'
                                  longitude:
                                      type: 'number'
                                      description: 'Longitude of the location in decimal degrees (e.g., -122.4194)'
                                  startDate:
                                      type: 'string'
                                      description: 'Start date for the forecast in ISO 8601 format (e.g., 2025-05-13)'
                                  endDate:
                                      type: 'string'
                                      description: 'End date for the forecast in ISO 8601 format (e.g., 2025-05-20)'
                              required: ['latitude', 'longitude']
                        - name: 'getGeocoding'
                          description: 'Convert city names to coordinates'
                          parameters:
                              type: 'object'
                              properties:
                                  name:
                                      type: 'string'
                                      description: "Name of the location to geocode (e.g., 'San Francisco')"
                                  count:
                                      type: 'integer'
                                      description: 'Maximum number of results to return (e.g., 5)'
                              required: ['name']
                    supportedAgentFrameworks: ['bedrock']

        # Define your chat app UI
        chatApps:
            - userId: 'cloudformation/${self:service}'
              chatApp:
                  chatAppId: 'weather-chat'
                  modesSupported: ['standalone', 'embedded']
                  dontCacheThis: true # For development
                  title: 'Weather Assistant'
                  description: 'Get weather information through natural conversation'
                  userTypes: ['internal-user']
                  agentId: '${self:service}-agent-${self:provider.stage}'
                  features:
                      fileUpload:
                          featureId: 'fileUpload'
                          enabled: true
                          mimeTypesAllowed: ['text/csv']
                      promptInputFieldLabel:
                          featureId: 'promptInputFieldLabel'
                          enabled: true
                          promptInputFieldLabel: 'Ready to chat about weather'
                      suggestions:
                          featureId: 'suggestions'
                          enabled: true
                          suggestions:
                              - "What's the weather in Tokyo?"
                              - 'What will the temperature be in Paris tomorrow?'
                              - 'Will it rain in London this weekend?'
                              - "What's the current weather in New York City?"
                              - 'Show me the forecast for Sydney for the next week'
                              - "What's the weather like in San Francisco right now?"
                          randomize: true
                          maxToShow: 3
                      agentInstructionAssistance:
                          featureId: 'agentInstructionAssistance'
                          enabled: true
                  enabled: true

functions:
    weatherFunction:
        handler: src/lambda/weather/index.handler
        timeout: 30
