name: Tests

on:
    pull_request:
    push:
        branches:
            - main

permissions:
    contents: read

concurrency:
    group: tests-${{ github.ref }}
    cancel-in-progress: true

jobs:
    node:
        name: Node (jest, vitest, type checks)
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
              with:
                  persist-credentials: false

            - name: Set Up Node
              uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
              with:
                  node-version-file: .nvmrc

            - name: Install pnpm
              run: npm i -g "pnpm@$(node -p "require('./package.json').packageManager.replace(/^pnpm@/, '').split('+')[0]")"

            - name: Install Dependencies
              run: pnpm install --frozen-lockfile

            - name: Build Shared Packages
              run: pnpm exec turbo run build --filter='./packages/*'

            - name: Service Tests
              run: pnpm --filter @pika/service test

            - name: Generate SvelteKit Types
              run: pnpm --filter @pika/chat exec svelte-kit sync

            - name: Chat Tests
              run: pnpm --filter @pika/chat test

            - name: Chat Component Tests
              run: pnpm --filter @pika/chat test:components

            - name: CLI Tests
              run: pnpm --filter pika-app test

            - name: Release Tooling Tests
              run: pnpm --filter @pika/tools test

            - name: Type Check Service
              run: pnpm --filter @pika/service check-types

            - name: Type Check pika-ux
              run: pnpm --filter pika-ux check-types

            - name: Type Check pika-shared
              run: pnpm --filter pika-shared check-types

    python:
        name: Python (converse-strands pytest)
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: services/pika/src/lambda/converse-strands
        steps:
            - name: Checkout
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
              with:
                  persist-credentials: false

            - name: Set Up Python
              uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
              with:
                  python-version: '3.14'

            - name: Install Dependencies
              run: pip install -r requirements-dev.txt

            - name: Run Tests
              run: pytest
